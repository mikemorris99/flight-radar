<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Flight Radar</title>
  <style>
    body { margin: 0; background-color: #050b05; color: #00ff66; font-family: monospace; overflow: hidden; }
    canvas { display: block; margin: 0 auto; background: #000; }
  </style>
</head>
<body>
  <canvas id="radarCanvas"></canvas>
  <script>
    const CONFIG = {
      lat: 51.049476,
      lon: 0.183738,
      radiusNm: 27,        // API query radius in NM (~50 km)
      maxRadiusKm: 50,     // Radar edge distance in km
      pollIntervalMs: 15000
    };

    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    let aircraftList = [];
    let statusText = "INITIALIZING...";

    function resizeCanvas() {
      const size = Math.min(window.innerWidth, window.innerHeight);
      canvas.width = size;
      canvas.height = size;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) ** 2 +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getBearingDeg(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180, φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;
      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    async function fetchAircraftData() {
      const lat = Number(CONFIG.lat);
      const lon = Number(CONFIG.lon);
      
      // Native CORS endpoints (No proxy required)
      const endpoints = [
        `https://api.adsb.lol/v2/point/${lat}/${lon}/${CONFIG.radiusNm}`,
        `https://api.adsb.one/v2/point/${lat}/${lon}/${CONFIG.radiusNm}`
      ];

      for (let url of endpoints) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;

          const data = await response.json();

          if (data && Array.isArray(data.ac)) {
            aircraftList = data.ac;
            statusText = `ONLINE | PLANES IN RANGE: ${aircraftList.length}`;
            console.log("Successfully fetched aircraft:", aircraftList.length);
            return;
          }
        } catch (e) {
          console.warn("Endpoint failed:", url, e);
        }
      }
      statusText = "ERROR: ALL API ENDPOINTS FAILED";
    }

    function drawRadar() {
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxPx = cx - 20;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Status Overlay
      ctx.fillStyle = '#00ff66';
      ctx.font = '12px monospace';
      ctx.fillText(statusText, 15, 25);

      // Distance Rings
      ctx.strokeStyle = '#003311';
      ctx.lineWidth = 1;
      for (let r = 10; r <= CONFIG.maxRadiusKm; r += 10) {
        const ringPx = (r / CONFIG.maxRadiusKm) * maxPx;
        ctx.beginPath();
        ctx.arc(cx, cy, ringPx, 0, 2 * Math.PI);
        ctx.stroke();
      }

      // Crosshairs
      ctx.beginPath();
      ctx.moveTo(cx, cy - maxPx); ctx.lineTo(cx, cy + maxPx);
      ctx.moveTo(cx - maxPx, cy); ctx.lineTo(cx + maxPx, cy);
      ctx.stroke();

      // Aircraft Blips
      aircraftList.forEach(ac => {
        if (typeof ac.lat !== 'number' || typeof ac.lon !== 'number') return;

        const distKm = getDistanceKm(CONFIG.lat, CONFIG.lon, ac.lat, ac.lon);
        if (distKm > CONFIG.maxRadiusKm) return;

        const bearing = getBearingDeg(CONFIG.lat, CONFIG.lon, ac.lat, ac.lon);
        const rPx = (distKm / CONFIG.maxRadiusKm) * maxPx;
        const angleRad = bearing * Math.PI / 180;

        const x = cx + rPx * Math.sin(angleRad);
        const y = cy - rPx * Math.cos(angleRad);

        const altMeters = typeof ac.alt_baro === 'number' ? Math.round(ac.alt_baro * 0.3048) : 'GND';

        ctx.fillStyle = '#00ff66';
        ctx.beginPath();
        ctx.arc(x, y, 4, 0, 2 * Math.PI);
        ctx.fill();

        ctx.fillStyle = '#00ff66';
        ctx.font = '10px monospace';
        const label = `${ac.flight ? ac.flight.trim() : 'UNK'} | ${altMeters}m`;
        ctx.fillText(label, x + 6, y + 3);
      });
    }

    setInterval(fetchAircraftData, CONFIG.pollIntervalMs);
    setInterval(drawRadar, 1000);
    fetchAircraftData();
  </script>
</body>
</html>
